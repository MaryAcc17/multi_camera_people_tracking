# /** wildcard so the params load regardless of the node's namespace
# (e.g. /jackal/twist_mux, /jackal1/twist_mux), not just a root-level twist_mux.
/**:
  ros__parameters:
    use_sim_time: true
    topics:
      joy:
        topic   : joy_teleop/cmd_vel
        timeout : 0.5
        priority: 10
      interactive_marker:
        topic   : twist_marker_server/cmd_vel
        timeout : 0.5
        priority: 8
      external:
        topic   : cmd_vel
        timeout : 0.5
        priority: 2
      stop:
        topic   : stop/cmd_vel
        timeout : 0.5
        priority: 1
    locks:
      e_stop:
        topic   : e_stop
        timeout : 0.0
        priority: 255